<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#titleGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .category-pill {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #ffffff;
      }
      .lang-symbol {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: bold;
        opacity: 0.18;
      }

      /* Dynamic Animations (Background Only) */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(25px, -20px) scale(1.08); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-30px, 18px) scale(1.05); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes rotateSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .floating-orb-1 {
        animation: floatSlow1 10s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatSlow2 12s ease-in-out infinite;
      }
      .pulsing-wave {
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: dashAnim 3s linear infinite;
      }
      .globe-spin {
        transform-origin: 1040px 180px;
        animation: rotateSlow 40s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs / Glows (strictly background layer) -->
  <g class="pulsing-wave" filter="url(#glow)">
    <circle class="floating-orb-1" cx="220" cy="90" r="120" fill="#38bdf8" opacity="0.3" />
    <circle class="floating-orb-2" cx="980" cy="260" r="140" fill="#818cf8" opacity="0.35" />
    <circle class="floating-orb-1" cx="620" cy="300" r="100" fill="#c084fc" opacity="0.25" />
  </g>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
  </g>

  <!-- Animated Translation Connection Stream Lines (Background) -->
  <g fill="none" opacity="0.35">
    <path class="stream-line" d="M 120 70 C 350 40, 480 140, 700 80 S 960 140, 1100 80" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 80 290 C 260 230, 420 320, 680 260 S 940 320, 1120 280" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Ambient Global Language Characters (Faint Background) -->
  <g fill="#93c5fd" class="lang-symbol">
    <text x="70" y="80" font-size="34">文</text>
    <text x="1100" y="70" font-size="36">A</text>
    <text x="80" y="310" font-size="32">Ω</text>
    <text x="1110" y="320" font-size="32">ع</text>
    <text x="960" y="60" font-size="28">ñ</text>
    <text x="150" y="190" font-size="28">한</text>
  </g>

  <!-- Background Rotating Wireframe Globe (Right Flank) -->
  <g class="globe-spin" opacity="0.18" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="1040" cy="180" r="95" />
    <ellipse cx="1040" cy="180" rx="95" ry="38" />
    <ellipse cx="1040" cy="180" rx="38" ry="95" />
    <line x1="945" y1="180" x2="1135" y2="180" />
    <line x1="1040" y1="85" x2="1040" y2="275" />
  </g>

  <!-- ================= FOREGROUND CONTENT CONTAINER ================= -->
  <!-- Crisp Center Backdrop Card to guarantee 100% foreground legibility -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="35" width="1060" height="290" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
  </g>

  <!-- Header Accent Tag -->
  <g>
    <rect x="440" y="58" width="320" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <text x="600" y="77" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="1.5">
      CURATED ECOSYSTEM GUIDE • i18n &amp; l10n
    </text>
  </g>

  <!-- Main Headline Title (Foreground) -->
  <text class="title-text" x="600" y="145" text-anchor="middle">
    Multi-Language Translation &amp; Localization
  </text>

  <!-- Subtitle (Foreground) -->
  <text class="subtitle-text" x="600" y="185" text-anchor="middle">
    A definitive index of top SaaS Translation Management Systems (TMS) &amp; Open-Source Translation Engines
  </text>

  <text class="subtitle-text" x="600" y="210" text-anchor="middle" font-size="14" fill="#64748b">
    Continuous Localization • Translation Memory • In-Context Editing • Offline Neural Machine Translation
  </text>

  <!-- Feature Pills / Badges (Foreground) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: SaaS TMS -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#38bdf8" stroke-width="1" />
      <text class="category-pill" x="70" y="22" text-anchor="middle">☁️ SaaS TMS</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="url(#badgeGrad2)" stroke="#a855f7" stroke-width="1" />
      <text class="category-pill" x="72" y="22" text-anchor="middle">⚡ Open Source</text>
    </g>

    <!-- Pill 3: Local Neural MT -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="155" height="34" rx="17" fill="url(#badgeGrad3)" stroke="#34d399" stroke-width="1" />
      <text class="category-pill" x="77" y="22" text-anchor="middle">🧠 Local AI &amp; NMT</text>
    </g>

    <!-- Pill 4: Git-Native -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text class="category-pill" x="70" y="22" text-anchor="middle" fill="#e2e8f0">🔄 Git-Native i18n</text>
    </g>
  </g>

  <!-- Outer Boundary Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
</svg>
