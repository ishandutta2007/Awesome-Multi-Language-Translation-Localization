<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".8"/><stop offset="100%" stop-color="#0369a1" stop-opacity=".8"/></linearGradient><linearGradient id="badgeGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7c3aed" stop-opacity=".8"/><stop offset="100%" stop-color="#6d28d9" stop-opacity=".8"/></linearGradient><linearGradient id="badgeGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#059669" stop-opacity=".8"/><stop offset="100%" stop-color="#047857" stop-opacity=".8"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="60"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".4" stdDeviation="12"/></filter><style>@keyframes floatSlow1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-20px) scale(1.08)}}@keyframes floatSlow2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,18px) scale(1.05)}}@keyframes pulseGlow{0%{opacity:.35}50%{opacity:.7}}.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;fill:url(#titleGrad);letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.category-pill,.lang-symbol,.subtitle-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.category-pill{font-weight:600;font-size:13px;fill:#fff}.lang-symbol{font-weight:700;opacity:.18}.floating-orb-1{animation:floatSlow1 10s ease-in-out infinite}.floating-orb-2{animation:floatSlow2 12s ease-in-out infinite}.pulsing-wave{animation:pulseGlow 5s ease-in-out infinite}.stream-line{stroke-dasharray:8 12;animation:dashAnim 3s linear infinite}.globe-spin{transform-origin:1040px 180px;animation:rotateSlow 40s linear infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g class="pulsing-wave" filter="url(#glow)"><circle cx="220" cy="90" r="120" fill="#38bdf8" class="floating-orb-1" opacity=".3"/><circle cx="980" cy="260" r="140" fill="#818cf8" class="floating-orb-2" opacity=".35"/><circle cx="620" cy="300" r="100" fill="#c084fc" class="floating-orb-1" opacity=".25"/></g><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="90" y2="90"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="270" y2="270"/><line x1="240" x2="240" y1="0" y2="360"/><line x1="480" x2="480" y1="0" y2="360"/><line x1="720" x2="720" y1="0" y2="360"/><line x1="960" x2="960" y1="0" y2="360"/></g><g fill="none" opacity=".35"><path stroke="#38bdf8" stroke-width="2" d="M 120 70 C 350 40, 480 140, 700 80 S 960 140, 1100 80" class="stream-line"/><path stroke="#c084fc" stroke-width="2" d="M 80 290 C 260 230, 420 320, 680 260 S 940 320, 1120 280" class="stream-line"/></g><g fill="#93c5fd" class="lang-symbol"><text x="70" y="80" font-size="34">文</text><text x="1100" y="70" font-size="36">A</text><text x="80" y="310" font-size="32">Ω</text><text x="1110" y="320" font-size="32">ع</text><text x="960" y=